<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>faryno.com.ar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#05070f;
  --fg:#e9ecff;
  --a:#6cf2c2;
  --b:#7aa2ff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}

body{
  background:radial-gradient(circle at 50% 50%, #0c1538, #05070f 60%);
  color:var(--fg);
  height:100vh;
  overflow:hidden;
  cursor:none;
}

/* ===== Custom cursor ===== */
.cursor{
  position:fixed;
  width:14px;height:14px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--a),var(--b));
  pointer-events:none;
  mix-blend-mode:screen;
  box-shadow:0 0 20px var(--a);
  transform:translate(-50%,-50%);
  z-index:9999;
}

/* ===== Canvas ===== */
canvas{
  position:fixed;
  inset:0;
  z-index:0;
}

/* ===== Content ===== */
main{
  position:relative;
  z-index:1;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  padding:3rem;
  max-width:900px;
  backdrop-filter:blur(18px);
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:24px;
  box-shadow:0 40px 120px rgba(0,0,0,.7);
  animation:float 6s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

h1{
  font-size:clamp(2.5rem,5vw,4rem);
  background:linear-gradient(90deg,var(--a),var(--b));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  position:relative;
}

h1::after{
  content:attr(data-text);
  position:absolute;
  left:2px;top:0;
  opacity:.4;
  filter:blur(2px);
}

p{
  margin-top:1.2rem;
  line-height:1.6;
  max-width:60ch;
  opacity:.9;
}

.buttons{
  margin-top:2rem;
  display:flex;
  gap:1rem;
}

button{
  padding:.9rem 1.4rem;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,var(--a),var(--b));
  color:#05070f;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}

button:hover{
  transform:translateY(-2px);
}
</style>
</head>

<body>

<div class="cursor"></div>
<canvas id="fx"></canvas>

<main>
  <section class="card">
    <h1 data-text="faryno.com.ar">faryno.com.ar</h1>
    <p>
      Dominio propio.  
      GitHub Pages.  
      Mouse tracking.  
      Partículas vivas.  
      Esto no es una landing, es una advertencia.
    </p>

    <div class="buttons">
      <button onclick="explode()">Desatar caos</button>
      <button onclick="invert()">Invertir realidad</button>
    </div>
  </section>
</main>

<script>
/* ===== Cursor ===== */
const cursor=document.querySelector('.cursor');
window.addEventListener('mousemove',e=>{
  cursor.style.left=e.clientX+'px';
  cursor.style.top=e.clientY+'px';
});

/* ===== Canvas particles ===== */
const canvas=document.getElementById('fx');
const ctx=canvas.getContext('2d');
let w,h;
function resize(){
  w=canvas.width=window.innerWidth;
  h=canvas.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

let mouse={x:w/2,y:h/2};
window.addEventListener('mousemove',e=>{
  mouse.x=e.clientX;
  mouse.y=e.clientY;
});

let particles=[];
for(let i=0;i<140;i++){
  particles.push({
    x:Math.random()*w,
    y:Math.random()*h,
    vx:(Math.random()-.5)*.6,
    vy:(Math.random()-.5)*.6
  });
}

function loop(){
  ctx.clearRect(0,0,w,h);
  for(let p of particles){
    let dx=mouse.x-p.x;
    let dy=mouse.y-p.y;
    let d=Math.hypot(dx,dy);
    if(d<180){
      p.vx+=dx*0.00005;
      p.vy+=dy*0.00005;
    }
    p.x+=p.vx;
    p.y+=p.vy;

    if(p.x<0||p.x>w)p.vx*=-1;
    if(p.y<0||p.y>h)p.vy*=-1;

    ctx.fillStyle='rgba(120,180,255,.7)';
    ctx.fillRect(p.x,p.y,1.6,1.6);
  }
  requestAnimationFrame(loop);
}
loop();

/* ===== Buttons ===== */
function explode(){
  particles.forEach(p=>{
    p.vx+=(Math.random()-.5)*6;
    p.vy+=(Math.random()-.5)*6;
  });
}

let inv=false;
function invert(){
  inv=!inv;
  document.body.style.filter=inv?'invert(1) hue-rotate(180deg)':'none';
}
</script>

</body>
</html>
